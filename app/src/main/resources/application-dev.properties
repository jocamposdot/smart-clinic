spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smart_clinic?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartclinic}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartclinic}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true

# Dev-only convenience (set via env var as well)
app.jwt.secret=${APP_JWT_SECRET:change-me-dev-secret}


