<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clinic - Portal Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginContainer" class="container">
        <div class="login-box">
            <h1>Smart Clinic Management System</h1>
            <h2>Portal do Administrador</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Entrar</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>

    <div id="dashboardContainer" class="container hidden">
        <header>
            <h1>Smart Clinic - Admin Dashboard</h1>
            <button id="logoutBtn">Sair</button>
        </header>
        <main>
            <h2>Adicionar Novo Médico</h2>
            <form id="addDoctorForm">
                <div class="form-group">
                    <label for="doctorName">Nome:</label>
                    <input type="text" id="doctorName" required>
                </div>
                <div class="form-group">
                    <label for="doctorEmail">Email:</label>
                    <input type="email" id="doctorEmail" required>
                </div>
                <div class="form-group">
                    <label for="doctorPhone">Telefone:</label>
                    <input type="text" id="doctorPhone">
                </div>
                <div class="form-group">
                    <label for="doctorSpecialty">Especialidade:</label>
                    <input type="text" id="doctorSpecialty" required>
                </div>
                <div class="form-group">
                    <label for="doctorPassword">Senha:</label>
                    <input type="password" id="doctorPassword" required>
                </div>
                <div class="form-group">
                    <label for="availableTimes">Horários Disponíveis (HH:mm, separados por vírgula):</label>
                    <input type="text" id="availableTimes" placeholder="09:00,10:00,14:00,15:00" required>
                </div>
                <button type="submit">Adicionar Médico</button>
                <div id="successMessage" class="success-message"></div>
                <div id="addDoctorError" class="error-message"></div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
