spring.application.name=smart-clinic

# Environment-aware config:
# - In dev, use env vars or application-dev.properties.
# - In prod, prefer env vars (no secrets in repo).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${APP_JWT_EXP_MINUTES:120}


